<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | Nextplay</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            <img src="assets/images/misc/logoNextplay.png" alt="Logo de Nextplay">
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>

    </header>


    <main>

       <section class="contacto">

            <div class="section-header">

                <p class="section-label">
                    Contacto
                </p>

                <h1>Contáctanos</h1>

                <p>
                    Si tenés alguna consulta o querés más información sobre nuestros productos, no dudes en contactarnos. Estamos aquí para ayudarte.
                </p>

            </div>

            <div class="contact-form">

                <form action="#" method="post">

                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit">Enviar</button>

                </form>
                    <p>Contactanos a nuestro numero de WhatsApp: +54 11 1234-5678</p>
            </div>

        </section>

    </main>


    <footer>
        <p>© Nextplay 2026 </p>
    </footer>

</body>

</html>
